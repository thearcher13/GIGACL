# GIGACL behind nginx on 80 and 443.
#
# Why a proxy at all, rather than binding uvicorn to 80 directly: ports below
# 1024 need privilege, and this process holds switch credentials -- it should
# be the last thing on the box running as root. nginx takes the privileged
# port, terminates TLS, and talks to GIGACL on 127.0.0.1:8000.
#
# Install:
#   sudo cp deploy/nginx-gigacl.conf /etc/nginx/sites-available/gigacl
#   sudo ln -s /etc/nginx/sites-available/gigacl /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# On RHEL/Rocky/Alma there is no sites-available: put it in
# /etc/nginx/conf.d/gigacl.conf instead.

# `Connection: upgrade` only when the client asked for it; a plain request
# needs `Connection: close`. This file is included from inside http{}, which is
# the context map belongs in. If your nginx.conf already defines this map,
# delete these four lines -- nginx refuses to start on a duplicate.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Port 80 exists only to send people to 443. The sign-in posts a password and
# every session afterwards carries a token; none of that belongs in clear text.
server {
    listen      80;
    listen      [::]:80;
    server_name gigacl.example.com;

    # Leave this open if you use certbot, which answers its challenge here.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name gigacl.example.com;

    # certbot writes these two lines for you if you run:
    #   sudo certbot --nginx -d gigacl.example.com
    # For an internal CA or a self-signed pair, point them at your own files.
    ssl_certificate     /etc/letsencrypt/live/gigacl.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gigacl.example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Only once you are certain every route into this host is HTTPS: browsers
    # remember it and will refuse plain HTTP for the whole max-age.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # An ACL export or a large `show running-config` can be big.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # The switch terminal is a websocket. Without these two headers the
        # connection is refused and the terminal opens to a blank pane.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        # GIGACL checks the caller's address against each user's trusted-hosts
        # list and writes it into every audit entry. Without these it sees the
        # proxy, so the allow list matches nobody and the log records 127.0.0.1
        # for everyone. Pair them with uvicorn's --proxy-headers
        # --forwarded-allow-ips 127.0.0.1, which is what makes them safe to
        # trust: the header is only honoured from this proxy.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A switch that is slow to answer a long ACL read must not be cut off
        # mid-command, and an idle terminal must not be dropped.
        proxy_connect_timeout   10s;
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;

        # Server-sent progress must not be held back in a buffer.
        proxy_buffering off;
    }

    # Health check for a load balancer or monitor. Unauthenticated by design
    # and says nothing but "ok".
    location = /api/health {
        proxy_pass http://127.0.0.1:8000/api/health;
        access_log off;
    }
}
