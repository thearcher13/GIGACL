<!--
  GIGACL mark — a shield holding a list.

  The shield is access control; the slots carved out of it are the access list
  itself, the second one short so the pair reads as a list rather than as a
  menu glyph. Two thick slots rather than three thin ones because the mark has
  to survive a 16px browser tab, where a 2.4-unit cut is barely one pixel and
  fills in against the body. Knockouts rather than painted bars, so the mark
  sits on any tab colour without carrying a background of its own.

  Colours are the dark-theme accents, hardcoded because a favicon is loaded on
  its own and has no page variables to read. The sidebar copy of this shape is
  inlined in index.html instead, where it can follow the theme.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="GIGACL">
  <defs>
    <linearGradient id="g" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d7cff"/>
      <stop offset=".52" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#3ddbe8"/>
    </linearGradient>
    <mask id="m">
      <path d="M16 2.4 L27.6 6.7 L27.6 16.1 C27.6 22.5 22.8 27.4 16 29.6
               C9.2 27.4 4.4 22.5 4.4 16.1 L4.4 6.7 Z" fill="#fff"/>
      <rect x="9.4" y="11.3" width="13.2" height="3.1" rx="1.55" fill="#000"/>
      <rect x="9.4" y="17.4" width="8.4" height="3.1" rx="1.55" fill="#000"/>
    </mask>
  </defs>
  <rect width="32" height="32" fill="url(#g)" mask="url(#m)"/>
</svg>
